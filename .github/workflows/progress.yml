name: progress-chart

on:
  push:
    branches:
      - main
    paths:
      - progress.yaml
      - tools/progress_chart.py
      - .github/workflows/progress.yml

permissions:
  contents: write

concurrency:
  group: progress-chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install chart dependencies
        run: python -m pip install --upgrade pip pillow pyyaml

      - name: Regenerate progress chart
        run: python3 tools/progress_chart.py

      - name: Commit updated chart
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/progress.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate progress chart [skip ci]"
            git push
          fi
