name: progress-chart

# Validates that progress.yaml parses and the chart generator runs.
# Does NOT commit anything back — the SVG is local-only (not tracked)
# to keep pushes simple (bot commits on main break subsequent pushes).

"on":
  push:
    branches: [main]
    paths:
      - progress.yaml
      - tools/progress_chart.py
      - .github/workflows/progress.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Validate progress chart generation
        run: python tools/progress_chart.py
