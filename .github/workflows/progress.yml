name: progress-chart

"on":
  push:
    branches: [main]
    paths:
      - progress.yaml
      - tools/progress_chart.py
      - .github/workflows/progress.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Generate progress chart
        run: python tools/progress_chart.py
      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/progress.svg
          if git diff --staged --quiet; then
            echo "Chart already up to date."
          else
            git commit -m "chore(progress): regenerate chart from progress.yaml [skip ci]"
            git push
          fi
